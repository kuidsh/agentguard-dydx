[project]
name = "agentguard-dydx"
version = "0.1.0"
description = "Risk guard, kill switch and tamper-evident audit log for AI agents trading on dYdX v4 (testnet)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dydx = ["dydx-v4-client"]
dev = ["pytest>=8"]

[project.scripts]
agentguard = "agentguard.cli:main"
agentguard-mcp = "agentguard.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
